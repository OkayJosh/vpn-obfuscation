[package]
name = "vpn-obfuscation-gui"
version = "0.1.0"
description = "Desktop controller for Tor + obfs4 over WireGuard and GNOME system proxy"
authors = ["okayjosh"]
edition = "2021"

[lib]
name = "vpn_obfuscation_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros"] }
